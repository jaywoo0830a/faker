<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector Value Faker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎭 Selector Faker</h1>
      <p class="subtitle">CSS 셀렉터 값을 지정하고 덮어쓰세요</p>
    </header>

    <section class="current-url-section">
      <label class="section-label">현재 페이지</label>
      <div class="url-display" id="currentUrl">로딩 중...</div>
      <div class="url-pattern-row">
        <input type="text" id="urlPattern" placeholder="URL 패턴 (* 와일드카드 지원)" />
        <button id="useCurrentUrlBtn" title="현재 URL 사용">📋</button>
      </div>
    </section>

    <section class="add-rule-section">
      <label class="section-label">새 규칙 추가</label>
      <div class="rule-input-row">
        <input type="text" id="selectorInput" placeholder="CSS 셀렉터 (예: #email, .name)" />
      </div>
      <div class="rule-input-row">
        <input type="text" id="valueInput" placeholder="설정할 값" />
        <button id="addRuleBtn" class="btn-primary">추가</button>
      </div>
      <div class="action-row">
        <button id="previewBtn" class="btn-secondary" disabled>👁 미리보기</button>
      </div>
    </section>

    <section class="rules-list-section">
      <div class="section-header">
        <label class="section-label">저장된 규칙</label>
        <button id="applyAllBtn" class="btn-small">🔄 모두 적용</button>
      </div>
      <div id="rulesList" class="rules-list">
        <div class="empty-state">아직 등록된 규칙이 없습니다.</div>
      </div>
    </section>

    <footer>
      <button id="exportBtn" class="btn-secondary btn-small">📤 내보내기</button>
      <button id="importBtn" class="btn-secondary btn-small">📥 가져오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
